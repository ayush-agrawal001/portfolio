<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14151B"/>
      <stop offset="0.6" stop-color="#232433"/>
      <stop offset="1" stop-color="#342C47"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7E9CD8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7E9CD8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2638"/>
      <stop offset="1" stop-color="#15161C"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g fill="#DCD7BA">
    <circle cx="120" cy="120" r="1.4" opacity=".6"/><circle cx="310" cy="60" r="1.1" opacity=".5"/><circle cx="470" cy="210" r="1.6" opacity=".6"/>
    <circle cx="690" cy="90" r="1.2" opacity=".5"/><circle cx="860" cy="260" r="1" opacity=".4"/><circle cx="1500" cy="80" r="1.5" opacity=".6"/>
    <circle cx="1650" cy="220" r="1.1" opacity=".5"/><circle cx="1800" cy="140" r="1.4" opacity=".5"/><circle cx="1240" cy="60" r="1.2" opacity=".4"/>
    <circle cx="990" cy="130" r="1.3" opacity=".5"/><circle cx="560" cy="330" r="1" opacity=".4"/><circle cx="1880" cy="330" r="1.2" opacity=".4"/>
  </g>

  <!-- moon -->
  <circle cx="1180" cy="340" r="330" fill="url(#halo)"/>
  <circle cx="1180" cy="340" r="170" fill="#F4F0E8"/>
  <g fill="#E3DBCF" opacity=".7">
    <circle cx="1130" cy="300" r="26"/><circle cx="1230" cy="390" r="18"/><circle cx="1210" cy="280" r="10"/><circle cx="1110" cy="400" r="13"/>
  </g>

  <!-- layered mountains -->
  <path d="M0 700 L240 560 L420 650 L640 520 L860 640 L1080 560 L1320 660 L1560 540 L1780 630 L1920 580 L1920 760 L0 760 Z" fill="#2E2A40"/>
  <path d="M0 740 L180 660 L380 720 L600 640 L820 730 L1040 670 L1280 740 L1500 660 L1720 730 L1920 680 L1920 800 L0 800 Z" fill="#262434"/>

  <!-- pagoda -->
  <g fill="#16161D" transform="translate(1440 520)">
    <rect x="-8" y="-150" width="16" height="40"/>
    <path d="M-70 -110 Q0 -130 70 -110 L90 -96 L-90 -96 Z"/>
    <rect x="-44" y="-96" width="88" height="34"/>
    <path d="M-100 -62 Q0 -84 100 -62 L124 -46 L-124 -46 Z"/>
    <rect x="-60" y="-46" width="120" height="38"/>
    <path d="M-130 -8 Q0 -32 130 -8 L156 10 L-156 10 Z"/>
    <rect x="-78" y="10" width="156" height="60"/>
    <rect x="-150" y="70" width="300" height="14"/>
  </g>
  <g fill="#FFA066" opacity=".85">
    <rect x="1426" y="440" width="10" height="14" rx="2"/><rect x="1446" y="440" width="10" height="14" rx="2"/>
    <rect x="1410" y="490" width="10" height="16" rx="2"/><rect x="1462" y="490" width="10" height="16" rx="2"/><rect x="1436" y="545" width="10" height="18" rx="2"/>
  </g>

  <!-- lake with moon reflection -->
  <rect x="0" y="790" width="1920" height="290" fill="url(#lake)"/>
  <g fill="#F4F0E8">
    <rect x="1100" y="820" width="160" height="4" rx="2" opacity=".55"/>
    <rect x="1080" y="850" width="200" height="4" rx="2" opacity=".4"/>
    <rect x="1120" y="880" width="120" height="3" rx="1.5" opacity=".35"/>
    <rect x="1060" y="912" width="240" height="3" rx="1.5" opacity=".22"/>
    <rect x="1140" y="945" width="80" height="3" rx="1.5" opacity=".2"/>
  </g>
  <g stroke="#727169" stroke-width="2" opacity=".35" fill="none">
    <path d="M120 860 h140 M340 900 h90 M520 960 h160 M780 880 h110 M1500 900 h150 M1700 960 h120 M300 1010 h200 M1400 1020 h180"/>
  </g>

  <!-- sakura tree -->
  <path d="M260 1080 C300 900 290 800 360 700 C400 640 470 610 560 590 M360 700 C300 640 240 620 170 610 M340 760 C420 740 500 760 580 720" fill="none" stroke="#16161D" stroke-width="26" stroke-linecap="round"/>
  <path d="M480 610 C520 560 600 540 680 540 M200 612 C160 580 120 560 60 560" fill="none" stroke="#16161D" stroke-width="12" stroke-linecap="round"/>
  <g fill="#D27E99">
    <circle cx="560" cy="560" r="70" opacity=".9"/><circle cx="660" cy="520" r="60" opacity=".85"/><circle cx="470" cy="520" r="62" opacity=".9"/>
    <circle cx="380" cy="600" r="58" opacity=".85"/><circle cx="220" cy="580" r="62" opacity=".9"/><circle cx="110" cy="560" r="55" opacity=".85"/>
    <circle cx="300" cy="530" r="60" opacity=".9"/><circle cx="600" cy="680" r="52" opacity=".85"/><circle cx="520" cy="740" r="42" opacity=".8"/>
    <circle cx="160" cy="650" r="45" opacity=".8"/>
  </g>
  <g fill="#E8A8BC">
    <circle cx="540" cy="530" r="34" opacity=".7"/><circle cx="650" cy="500" r="26" opacity=".7"/><circle cx="300" cy="505" r="30" opacity=".7"/>
    <circle cx="200" cy="560" r="28" opacity=".6"/><circle cx="460" cy="495" r="26" opacity=".6"/><circle cx="600" cy="660" r="22" opacity=".6"/>
  </g>
  <g fill="#D27E99" opacity=".8">
    <ellipse cx="760" cy="620" rx="6" ry="3.5" transform="rotate(30 760 620)"/>
    <ellipse cx="840" cy="720" rx="5" ry="3" transform="rotate(-25 840 720)"/>
    <ellipse cx="930" cy="560" rx="5" ry="3" transform="rotate(45 930 560)"/>
    <ellipse cx="700" cy="820" rx="6" ry="3.5" transform="rotate(15 700 820)"/>
    <ellipse cx="1000" cy="690" rx="4.5" ry="2.8" transform="rotate(-40 1000 690)"/>
    <ellipse cx="880" cy="880" rx="5" ry="3" transform="rotate(20 880 880)"/>
    <ellipse cx="1080" cy="780" rx="4" ry="2.5" transform="rotate(60 1080 780)"/>
  </g>
</svg>
