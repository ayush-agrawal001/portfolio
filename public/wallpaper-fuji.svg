<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161D"/>
      <stop offset="0.55" stop-color="#2A2A37"/>
      <stop offset="1" stop-color="#2D4F67"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6A15A"/>
      <stop offset="1" stop-color="#C34043"/>
    </linearGradient>
    <mask id="sunStripes">
      <rect width="1920" height="1080" fill="#fff"/>
      <rect x="0" y="470" width="1920" height="10" fill="#000"/>
      <rect x="0" y="505" width="1920" height="14" fill="#000"/>
      <rect x="0" y="545" width="1920" height="18" fill="#000"/>
      <rect x="0" y="590" width="1920" height="22" fill="#000"/>
      <rect x="0" y="638" width="1920" height="26" fill="#000"/>
    </mask>
    <!-- seigaiha: the traditional Japanese wave pattern -->
    <pattern id="seigaiha" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#1F1F28"/>
      <g fill="#1F1F28" stroke="#2D4F67" stroke-width="2">
        <circle cx="40" cy="40" r="38"/><circle cx="40" cy="40" r="28"/><circle cx="40" cy="40" r="18"/><circle cx="40" cy="40" r="8"/>
        <circle cx="0" cy="20" r="38"/><circle cx="0" cy="20" r="28"/><circle cx="0" cy="20" r="18"/><circle cx="0" cy="20" r="8"/>
        <circle cx="80" cy="20" r="38"/><circle cx="80" cy="20" r="28"/><circle cx="80" cy="20" r="18"/><circle cx="80" cy="20" r="8"/>
        <circle cx="0" cy="60" r="38"/><circle cx="0" cy="60" r="28"/><circle cx="0" cy="60" r="18"/><circle cx="0" cy="60" r="8"/>
        <circle cx="80" cy="60" r="38"/><circle cx="80" cy="60" r="28"/><circle cx="80" cy="60" r="18"/><circle cx="80" cy="60" r="8"/>
      </g>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <g fill="#DCD7BA">
    <circle cx="140" cy="90" r="1.6" opacity=".6"/><circle cx="380" cy="160" r="1.2" opacity=".5"/><circle cx="560" cy="70" r="1.8" opacity=".7"/>
    <circle cx="760" cy="200" r="1.2" opacity=".4"/><circle cx="880" cy="110" r="1.5" opacity=".6"/><circle cx="1010" cy="240" r="1" opacity=".5"/>
    <circle cx="1090" cy="60" r="1.4" opacity=".5"/><circle cx="1560" cy="300" r="1.2" opacity=".4"/><circle cx="1720" cy="420" r="1.5" opacity=".5"/>
    <circle cx="260" cy="330" r="1.3" opacity=".4"/><circle cx="640" cy="310" r="1" opacity=".4"/><circle cx="1860" cy="520" r="1.2" opacity=".4"/>
  </g>

  <circle cx="1320" cy="470" r="250" fill="url(#sun)" mask="url(#sunStripes)" opacity=".92"/>

  <!-- Fuji -->
  <path d="M380 820 L900 420 Q960 378 1020 376 Q1080 378 1140 420 L1700 820 Z" fill="#363646"/>
  <path d="M900 420 Q960 378 1020 376 Q1080 378 1140 420 L1193 460 L1152 474 L1112 450 L1082 486 L1042 456 L1004 490 L970 458 L932 480 L895 455 L849 460 Z" fill="#DCD7BA" opacity=".92"/>
  <path d="M1020 376 Q1080 378 1140 420 L1700 820 L1360 820 Z" fill="#16161D" opacity=".22"/>

  <!-- far hills and torii -->
  <path d="M0 800 Q220 740 430 780 T860 790 T1300 770 T1920 790 L1920 850 L0 850 Z" fill="#2A2A37"/>
  <g transform="translate(560 700)" fill="#C34043">
    <path d="M-12 0 Q55 -18 122 0 L118 12 Q55 -2 -8 12 Z"/>
    <rect x="4" y="24" width="102" height="9" rx="2"/>
    <rect x="16" y="8" width="11" height="84"/>
    <rect x="83" y="8" width="11" height="84"/>
    <rect x="50" y="12" width="10" height="14"/>
  </g>

  <!-- sea -->
  <rect x="0" y="840" width="1920" height="240" fill="url(#seigaiha)"/>
  <rect x="0" y="840" width="1920" height="240" fill="#16161D" opacity=".25"/>

  <!-- great wave -->
  <path d="M0 790 C140 610 380 560 500 660 C560 712 520 790 450 780 C492 748 470 700 420 706 C350 716 318 800 360 880 C390 940 470 980 560 1080 L0 1080 Z" fill="#223249"/>
  <path d="M0 790 C140 610 380 560 500 660 C560 712 520 790 450 780" fill="none" stroke="#7FB4CA" stroke-width="4" opacity=".7"/>
  <path d="M40 860 C150 720 320 690 400 740" fill="none" stroke="#727169" stroke-width="3" opacity=".8"/>
  <path d="M60 950 C170 830 300 810 370 840" fill="none" stroke="#727169" stroke-width="3" opacity=".6"/>
  <g fill="#DCD7BA">
    <circle cx="455" cy="672" r="7"/><circle cx="478" cy="690" r="6"/><circle cx="492" cy="714" r="5"/><circle cx="430" cy="660" r="6"/>
    <circle cx="404" cy="654" r="5"/><circle cx="470" cy="740" r="4"/><circle cx="452" cy="758" r="4"/><circle cx="378" cy="652" r="4"/>
  </g>

  <!-- cherry branch -->
  <path d="M1920 70 C1800 60 1720 110 1640 100 C1580 92 1530 60 1470 70" fill="none" stroke="#54546D" stroke-width="12" stroke-linecap="round"/>
  <path d="M1700 104 C1680 150 1650 170 1610 180 M1560 80 C1540 50 1510 40 1480 30" fill="none" stroke="#54546D" stroke-width="7" stroke-linecap="round"/>
  <g fill="#D27E99">
    <circle cx="1480" cy="68" r="11"/><circle cx="1500" cy="84" r="9" opacity=".8"/><circle cx="1470" cy="32" r="9"/><circle cx="1540" cy="64" r="10"/>
    <circle cx="1612" cy="178" r="11"/><circle cx="1634" cy="168" r="8" opacity=".8"/><circle cx="1660" cy="96" r="10"/><circle cx="1700" cy="110" r="9"/>
    <circle cx="1760" cy="82" r="11"/><circle cx="1790" cy="70" r="8" opacity=".8"/><circle cx="1850" cy="66" r="10"/><circle cx="1586" cy="102" r="8"/>
  </g>
  <g fill="#E8A8BC">
    <circle cx="1480" cy="68" r="3.5"/><circle cx="1612" cy="178" r="3.5"/><circle cx="1760" cy="82" r="3.5"/><circle cx="1540" cy="64" r="3"/><circle cx="1660" cy="96" r="3"/>
  </g>
  <g fill="#D27E99" opacity=".75">
    <ellipse cx="1420" cy="220" rx="6" ry="3.5" transform="rotate(30 1420 220)"/>
    <ellipse cx="1260" cy="160" rx="5" ry="3" transform="rotate(-20 1260 160)"/>
    <ellipse cx="1540" cy="330" rx="6" ry="3.5" transform="rotate(50 1540 330)"/>
    <ellipse cx="1120" cy="280" rx="5" ry="3" transform="rotate(10 1120 280)"/>
    <ellipse cx="1680" cy="260" rx="5" ry="3" transform="rotate(-35 1680 260)"/>
    <ellipse cx="820" cy="360" rx="4.5" ry="2.8" transform="rotate(25 820 360)"/>
  </g>
</svg>
